<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- Two-pane layout: folder sidebar (left) + selected folder's contents
         (right). On mobile only one pane shows at a time; opening a folder adds
         `layout--show-content` to swap the sidebar out for the contents. -->
    <div class="layout" id="layout">

      <!-- Sidebar: brand, add-folder, search, and the list of all folders. -->
      <aside class="sidebar">
        <header class="sidebar__head">
          <!-- Clicking the title returns to GLOBAL (the top-level context). -->
          <h1 id="home-link" class="sidebar__title" role="button" tabindex="0"
              title="Go to GLOBAL">Bookmarks</h1>
          <p class="sidebar__subtitle">A calm home for your links.</p>
        </header>

        <!-- Create a folder (category). -->
        <form id="category-form" class="form form--inline" autocomplete="off">
          <label class="field field--grow">
            <span class="field__label">New folder</span>
            <input
              type="text"
              id="category-input"
              class="input"
              placeholder="e.g. Work, Reading, Tools"
              required
            />
          </label>
          <button type="submit" class="btn btn--ghost">Add</button>
          <p id="category-error" class="form__error" role="alert"></p>
        </form>

        <!-- Global search: folders, subfolders, and bookmarks. The yellow
             styling (see .search) sets it apart from the "create" forms. -->
        <label class="field">
          <span class="field__label">Search everywhere</span>
          <input
            type="search"
            id="search-input"
            class="input search"
            placeholder="Search folders, subfolders & links…"
            aria-label="Search everywhere"
          />
        </label>

        <!-- Folder list renders here; each folder is a clickable button. -->
        <nav id="folder-list" class="folders" aria-label="Folders"></nav>

        <!-- Backup/restore everything as a JSON file — useful for moving to a
             new browser or file location, since the data itself lives only in
             this page's localStorage and doesn't follow the file around. -->
        <div class="sidebar__data">
          <div class="sidebar__data-row">
            <button type="button" id="export-btn" class="btn btn--ghost">Export</button>
            <button type="button" id="import-btn" class="btn btn--ghost">Import</button>
          </div>
          <input type="file" id="import-file" accept="application/json" hidden />
          <p id="data-status" class="data-status" role="status" aria-live="polite"></p>
        </div>
      </aside>

      <!-- Content: the open folder's header, the add-bookmark form, and its
           bookmarks (or search results across all folders). -->
      <section class="content">
        <header class="content__head">
          <!-- Only visible on mobile: jumps back to the folder list. -->
          <button type="button" id="back-btn" class="btn btn--ghost content__back">← Folders</button>
          <!-- Always-visible breadcrumb: "Folder" or "Folder / Subfolder". -->
          <h2 id="breadcrumb" class="content__title breadcrumb">Bookmarks</h2>
          <span id="content-count" class="group__count" hidden></span>
          <!-- Rename/delete the open subfolder; shown only for real subfolders. -->
          <span id="subfolder-actions" class="subfolder-actions" hidden>
            <button type="button" id="rename-subfolder" class="btn btn--ghost">Rename</button>
            <button type="button" id="delete-subfolder" class="btn btn--danger">Delete</button>
          </span>
          <!-- Rename/delete the open folder; shown only at a folder's own
               Unsorted level (not while a real subfolder is open). -->
          <span id="folder-actions" class="subfolder-actions" hidden>
            <button type="button" id="rename-folder" class="btn btn--ghost">Rename</button>
            <button type="button" id="delete-folder" class="btn btn--danger">Delete</button>
          </span>
        </header>

        <!-- Context-aware helper text: says where a new bookmark will land. -->
        <p id="add-hint" class="add-hint" hidden></p>

        <!-- Add a bookmark — the primary action, so it comes first. The folder
             and subfolder are OPTIONAL: leave them and the link stays where you
             are (unsorted); or pick a destination to file it right away. -->
        <form id="bookmark-form" class="form form--create" autocomplete="off">
          <div class="form__row">
            <label class="field field--grow">
              <span class="field__label">Name</span>
              <input
                type="text"
                id="name-input"
                class="input"
                placeholder="e.g. Claude"
                required
              />
            </label>
            <label class="field field--grow">
              <span class="field__label">Link</span>
              <input
                type="url"
                id="url-input"
                class="input"
                placeholder="https://claude.ai"
                required
              />
            </label>
          </div>
          <div class="form__row">
            <label class="field field--grow">
              <span class="field__label">Folder (optional)</span>
              <select id="bk-folder" class="input" aria-label="Folder"></select>
            </label>
            <label class="field field--grow">
              <span class="field__label">Subfolder (optional)</span>
              <select id="bk-sub" class="input" aria-label="Subfolder"></select>
            </label>
          </div>
          <button type="submit" class="btn btn--primary">Add bookmark</button>
          <p id="form-error" class="form__error" role="alert"></p>
        </form>

        <!-- Create a subfolder inside the open folder. Shown only when a folder
             is selected but no subfolder is open yet. -->
        <form id="subfolder-form" class="form form--inline" autocomplete="off" hidden>
          <label class="field field--grow">
            <span class="field__label">New subfolder</span>
            <input
              type="text"
              id="subfolder-input"
              class="input"
              placeholder="e.g. workflows, case studies"
              required
            />
          </label>
          <button type="submit" class="btn btn--ghost">Add subfolder</button>
          <p id="subfolder-error" class="form__error" role="alert"></p>
        </form>

        <!-- Bookmarks of the open subfolder, or search matches, render here. -->
        <ul id="bookmark-list" class="list"></ul>
        <p id="no-results" class="empty" hidden>Nothing matches your search.</p>
        <p id="empty-state" class="empty" hidden>Create a folder to start adding bookmarks.</p>
        <p id="pick-subfolder" class="empty" hidden>Pick a subfolder to see its bookmarks.</p>
      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
