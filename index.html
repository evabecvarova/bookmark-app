<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Bookmarks</h1>
      <p class="app__subtitle">A calm little home for your favorite links.</p>
    </header>

    <!-- Create a category -->
    <form id="category-form" class="card form form--inline" autocomplete="off">
      <label class="field field--grow">
        <span class="field__label">New category</span>
        <input
          type="text"
          id="category-input"
          class="input"
          placeholder="e.g. Work, Reading, Tools"
          required
        />
      </label>
      <button type="submit" class="btn btn--ghost">Add category</button>
      <p id="category-error" class="form__error" role="alert"></p>
    </form>

    <!-- Add a bookmark: a name, a link, and a category -->
    <form id="bookmark-form" class="card form" autocomplete="off">
      <label class="field">
        <span class="field__label">Name</span>
        <input
          type="text"
          id="name-input"
          class="input"
          placeholder="e.g. Claude"
          required
        />
      </label>

      <label class="field">
        <span class="field__label">Link</span>
        <input
          type="url"
          id="url-input"
          class="input"
          placeholder="https://claude.ai"
          required
        />
      </label>

      <label class="field">
        <span class="field__label">Category</span>
        <select id="category-select" class="input"></select>
      </label>

      <button type="submit" class="btn btn--primary">Add bookmark</button>
      <p id="form-error" class="form__error" role="alert"></p>
    </form>

    <!-- Search + bulk collapse/expand. Hidden until a category exists. -->
    <div id="toolbar" class="toolbar" hidden>
      <input
        type="search"
        id="search-input"
        class="input"
        placeholder="Search bookmarks…"
        aria-label="Search bookmarks"
      />
      <button type="button" id="toggle-all" class="btn btn--ghost">Collapse all</button>
    </div>

    <!-- Bookmarks render here, grouped under category headings -->
    <section id="bookmark-groups" class="groups"></section>
    <p id="no-results" class="empty" hidden>No bookmarks match your search.</p>
    <p id="empty-state" class="empty">Create a category to start adding bookmarks.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
